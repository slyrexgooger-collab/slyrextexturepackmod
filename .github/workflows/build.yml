name: Mod bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Bauen
        run: gradle build --no-daemon
      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: texturepackbuilder
          path: build/libs/*.jar
      - name: Als Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "Texture Pack Builder (neueste Version)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Die .jar zusammen mit der Fabric API in den mods-Ordner legen (Minecraft 1.21.11)." --latest
