name: PvP-Abdeckung prüfen

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/main/resources/assets/texturepackbuilder/pvp_items.json'
      - 'tools/pvp_coverage.py'

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/pvp_coverage.py
